[AllPix]
log_level = "WARNING"
log_format = "DEFAULT"
number_of_events = 10000
detectors_file = "detector.conf"
model_paths = ./
multithreading = true

[GeometryBuilderGeant4]
world_material = "vacuum"

[DepositionGeant4]
physics_list = FTFP_BERT_LIV
particle_type = "alpha"
source_energy = 5MeV
source_position = 0um 0um -0.5mm
source_type = "beam"
beam_size = 13mm
beam_direction = 0 0 1
max_step_length = 10.0um
output_plots = true

[ElectricFieldReader]
model="linear"
bias_voltage=-150V
depletion_voltage=-100V

[GenericPropagation]
temperature = 293K
charge_per_step = 100
output_plots = true
activate_electrostatic_repulsion = true
[SimpleTransfer]
max_depth_distance = 5um
output_plots = true

[DefaultDigitizer]
threshold = 600e
output_plots = true

[ROOTObjectWriter]
exclude = DepositedCharge, PropagatedCharge
file_name = "output_source_measurement.root"

[DetectorHistogrammer]
